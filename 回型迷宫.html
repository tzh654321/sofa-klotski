<style>

let li = 0, board = null, px = 0, py = 0, trail = [], playing = false, timer = null, showTrail = true;

function build() {
  const L = LEVELS[li];
  const wall = Array.from({length: L.h}, () => new Array(L.w).fill(false));
  for (const p of L.pieces) {
    if (p.id === 'hero') continue;
    for (const [dc, dr] of p.cells) {
      const c = p.x + dc, r = p.y + dr;
      if (c >= 0 && r >= 0 && c < L.w && r < L.h) wall[r][c] = true;
    }
  }
  board = {L, wall, goal: L.goal, n: 0};
  px = 0; py = 0; trail = [[0, 0]]; stop(); draw();
  document.getElementById('msg').textContent = '方向键 / WASD / 点击上方按钮移动';
  document.getElementById('msg').className = 'msg';
}
function stop() { playing = false; if (timer) { clearInterval(timer); timer = null; } document.getElementById('btnPlay').textContent = '播放最短解'; }
function move(dx, dy, fromPlay) {
  if (playing && !fromPlay) return;
  const nx = px + dx, ny = py + dy;
  if (nx < 0 || ny < 0 || nx >= board.L.w || ny >= board.L.h || board.wall[ny][nx]) return false;
  px = nx; py = ny; trail.push([nx, ny]); board.n++;
  draw();
  if (px === board.goal[0] && py === board.goal[1]) {
    const m = document.getElementById('msg');
    m.textContent = '到达中心！用了 ' + board.n + ' 步（最短 ' + board.L.depth + ' 步）';
    m.className = 'msg win';
    stop();
  }
  return true;
}
function draw() {
  const L = board.L, W = L.w, H = L.h;
  const pad = 14, cell = Math.floor((cv.width - pad * 2) / W);
  const ox = Math.floor((cv.width - cell * W) / 2), oy = Math.floor((cv.height - cell * H) / 2);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#fffdf7'; ctx.fillRect(0, 0, cv.width, cv.height);
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const x = ox + c * cell, y = oy + r * cell;
    ctx.fillStyle = board.wall[r][c] ? '#2b303d' : '#f2ead8';
    ctx.fillRect(x, y, cell, cell);
  }
  if (showTrail && trail.length > 1) {
    ctx.strokeStyle = 'rgba(96,165,214,.85)'; ctx.lineWidth = Math.max(2, cell * .28);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.beginPath();
    trail.forEach(([c, r], i) => {
      const x = ox + c * cell + cell / 2, y = oy + r * cell + cell / 2;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();
  }
  // 终点
  const gx = ox + board.goal[0] * cell + cell / 2, gy = oy + board.goal[1] * cell + cell / 2;
  ctx.fillStyle = '#de9f28'; ctx.beginPath(); ctx.arc(gx, gy, cell * .42, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff6dc'; ctx.beginPath(); ctx.arc(gx, gy, cell * .18, 0, 7); ctx.fill();
  // 玩家
  const sx = ox + px * cell + cell / 2, sy = oy + py * cell + cell / 2;
  ctx.fillStyle = '#35a86e'; ctx.beginPath(); ctx.arc(sx, sy, cell * .4, 0, 7); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = '#d8cfba'; ctx.lineWidth = 1; ctx.strokeRect(ox, oy, cell * W, cell * H);
}
function play() {
  if (playing) { stop(); return; }
  stop(); build_keep_board();
  const moves = LEVELS[li].moves;
  let i = 0; playing = true; document.getElementById('btnPlay').textContent = '停止';
  timer = setInterval(() => {
    if (i >= moves.length) { stop(); return; }
    const m = moves[i++]; move(m.dx, m.dy, true);
  }, 45);
}
function build_keep_board() { // 只重置位置，不重建面板
  px = 0; py = 0; trail = [[0, 0]]; board.n = 0; draw();
  const m = document.getElementById('msg'); m.textContent = '播放最短解…'; m.className = 'msg';
}
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') { e.preventDefault(); move(0, -1); }
  if (k === 'arrowdown' || k === 's') { e.preventDefault(); move(0, 1); }
  if (k === 'arrowleft' || k === 'a') { e.preventDefault(); move(-1, 0); }
  if (k === 'arrowright' || k === 'd') { e.preventDefault(); move(1, 0); }
});
document.querySelectorAll('.pad button').forEach(b => b.onclick = () => {
  const [dx, dy] = b.dataset.dir.split(',').map(Number); move(dx, dy);
});
document.getElementById('btnPlay').onclick = play;
document.getElementById('btnReset').onclick = () => { stop(); build(); };
document.getElementById('btnTrail').onclick = () => { showTrail = !showTrail; draw(); };
document.getElementById('btnM2').onclick = () => { const L = LEVELS[li]; L.m2 = null; ensureM2(L); stats(); };

function tabs() {
  const el = document.getElementById('tabs');
  LEVELS.forEach((L, i) => {
    const b = document.createElement('button');
    b.textContent = L.name;
    b.onclick = () => { li = i; [...el.children].forEach(x => x.classList.remove('on')); b.classList.add('on'); stop(); build(); ensureM2(LEVELS[li]); stats(); };
    if (!i) b.classList.add('on');
    el.appendChild(b);
  });
}
/* ── maze-2 难度（与生成器共用 tools/maze/difficulty.js） ── */
function modelOf(L) {
  const wall = new Uint8Array(L.w * L.h);
  for (const p of L.pieces) {
    if (p.id === 'hero') continue;
    for (const c of (p.cells || [])) {
      const dc = Array.isArray(c) ? c[0] : c.c, dr = Array.isArray(c) ? c[1] : c.r;
      const x = p.x + dc, y = p.y + dr;
      if (x >= 0 && y >= 0 && x < L.w && y < L.h) wall[y * L.w + x] = 1;
    }
  }
  return { w: L.w, h: L.h, wall, start: 0, goal: L.goal[1] * L.w + L.goal[0] };
}
function ensureM2(L) {
  if (L.m2) return;
  L.m2 = 'busy';
  setTimeout(function () {
    try {
      const ev = MazeDiff.evaluate(modelOf(L), { maxPaths: 200000 });
      L.m2 = { score: ev.score, paths: ev.paths, exact: ev.exact, ms: 0 };
    } catch (e) { L.m2 = { err: String((e && e.message) || e) }; }
    stats();
  }, 40);
}
function m2Text(L) {
  const V = (typeof MazeDiff !== 'undefined' && MazeDiff.VERSION) || 'maze';
  if (L.m2 === 'busy') return V + ' 计算中…';
  if (!L.m2) return V + ' 未算（点「重算难度」）';
  if (L.m2.err) return V + ' 算出错：' + L.m2.err;
  return V + ' <b>' + L.m2.score.toFixed(2) + '</b>（' + L.m2.paths + ' 条简单路径' +
    (L.m2.exact ? '，穷举' : '，>20 万条截断') + '）';
}
function stats() {
  const L = LEVELS[li];
  document.getElementById('stats').innerHTML =
    '解题难度 <b>' + L.score + '</b>/100 · ' + L.grade +
    ' &nbsp; 最短 <b>' + L.depth + '</b> 步' +
    ' &nbsp; 路径 ' + L.paths + ' 条' +
    ' &nbsp; 岔路 ' + L.junctions +
    ' &nbsp; 死胡同 ' + L.dead +
    '<br>' + m2Text(L);
}
tabs(); build(); ensureM2(LEVELS[li]); stats();
